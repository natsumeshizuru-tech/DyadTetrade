services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    ports: ["8000:8000"]
    volumes:
      - ../data:/app/data
      - ../reports:/app/reports
    environment:
      DYADTETRADE_ENABLE_LIVE_TRADING: "false"
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api/v1
    ports: ["8080:80"]
    depends_on: [api]
    restart: unless-stopped
