name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DYADTETRADE_EXECUTION_MODE: paper
  DYADTETRADE_ENABLE_LIVE_TRADING: "false"
  DYADTETRADE_LIVE_ENABLED: "false"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[trading,dev]" build
      - name: Static gates
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy src/dyadtetrade
      - name: Tests and coverage
        run: >-
          python -m pytest --cov=dyadtetrade --cov-report=term-missing
          --cov-report=xml --cov-fail-under=75
      - name: Public API and zero-order safety gate
        run: python -m pytest tests/test_public_app.py tests/test_paper_strategy_runner.py -q
      - name: Build wheel
        run: python -m build
      - name: Dependency consistency
        run: python -m pip check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
